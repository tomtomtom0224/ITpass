<!DOCTYPE html>
<html lang="ja">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT要点暗記ノート</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
      line-height: 1.6;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      color: #2c3e50;
      border-bottom: 2px solid #8a9aa5;
      padding-bottom: 10px;
    }
    h2 {
      background-color: #8a9aa5;
      color: white;
      padding: 8px 15px;
      border-radius: 4px;
      margin-top: 30px;
      font-size: 1.2rem;
    }
    dl {
      margin: 0;
      padding: 0;
    }
    
    dt {
      font-weight: bold;
      color: #e74c3c;
      width: 30%;
      min-width: 200px;
      padding-right: 10px;
    }
    dd {
      margin: 0;
      width: 65%;
      flex-grow: 1;
    }
    @media (max-width: 600px) {
      dt, dd {
        width: 100%;
      }
      dt {
        color: #d35400;
        margin-bottom: 4px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>ITパス暗記ノート</h1>
<!-- ノートの上部にボタンを配置 -->
<div style="margin-bottom: 20px;">
<button id="toggleBtn">すべての説明を表示</button>
</div>

<!-- 例：用語リスト構造 -->
<h2>9章</h2>
    <div class="item">
      <dt>アルゴリズム</dt>
      <dd class="hidden">問題を解決するときの手順（手続）</dd>
    </div>
    <div class="item">
      <dt>HTML</dt>
      <dd class="hidden">Webページの論理構造や文字要素を記述するマークアップ言語。HTMLでは、タグの使い方決まっている</dd>
    </div>
    <div class="item">
      <dt>XML</dt>
      <dd class="hidden">利用者が自由にタグを定義できる</dd>
    </div>
    <div class="item">
      <dt>CSS</dt>
      <dd class="hidden">Webページのデザインやレイアウトを指定する言語</dd>
    </div>
    <div class="item">
      <dt></dt>
      <dd class="hidden">変数に関して以下の3つが重要
          変数の宣言では、文頭に型名を書く。<br>
         （例）整数型：num<br>
          変数の代入には「←」を使う<br>
         （例）num ← 3<br>
          変数の宣言と初期化は同時に行える<br>
         （例）整数型：num ← 3</dd>
    </div>
    <div class="item">
      <dt>配列</dt>
      <dd class="hidden">・配列の初期化には「{ }」を使う<br>
          ・配列から要素を取り出すには「[ ]」を使う</dd>
    </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    
    // 1. 全体ボタンの設定
    let isShowAll = false;
    const btn = document.getElementById('toggleBtn');
    
    if (btn) {
      // スマホのタッチとPCのクリックの両方に対応
      const handleToggleAll = function(e) {
        e.preventDefault(); // タップのズレやダブル発火を防止
        const allDd = document.querySelectorAll('dd');
        isShowAll = !isShowAll;

        allDd.forEach(dd => {
          if (isShowAll) {
            dd.classList.remove('hidden');
          } else {
            dd.classList.add('hidden');
          }
        });

        btn.textContent = isShowAll ? "すべての説明を隠す" : "すべての説明を表示";
      };

      btn.addEventListener('touchend', handleToggleAll, { passive: false });
      btn.addEventListener('click', handleToggleAll);
    }

    // 2. 個別の用語（dt）の設定
    const dts = document.querySelectorAll('dt');
    dts.forEach(dt => {
      const handleToggleDt = function(e) {
        // 直後のddを取得してクラスを切り替え
        const targetDd = this.nextElementSibling;
        if (targetDd && targetDd.tagName === 'DD') {
          targetDd.classList.toggle('hidden');
        }
      };

      // スマホでのタップ対応
      dt.addEventListener('click', handleToggleDt);
    });

  });
</script>

</body>
</html>
