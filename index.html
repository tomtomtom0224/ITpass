<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | ITパス暗記ノート</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      text-align: center;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      width: 80%;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #5b7e91;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>ITパス暗記ノート</h2>
    <p>パスワードを入力してください</p>
    <input type="password" id="passInput" placeholder="Password">
    <br>
    <button onclick="checkPassword()">ログイン</button>
  </div>

  <script>
    function checkPassword() {
      const password = document.getElementById("passInput").value;
      
      // tomteco0224（例: mypass1234）
      if (password === "tomteco0224") {
        // 合致したら暗記ノートページへジャンプ
        window.location.href = "index2.html";
      } else {
        alert("パスワードが違います");
      }
    }
  </script>

</body>
</html>
